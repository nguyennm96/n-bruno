[package]
name = "bruno-server"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "bruno-server"
path = "src/main.rs"

[lib]
name = "bruno_server"
path = "src/lib.rs"

[dependencies]
# Web framework
axum = { version = "0.7", features = ["ws", "multipart", "macros"] }
axum-extra = { version = "0.9", features = ["typed-header"] }
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace", "compression-gzip"] }
tokio = { version = "1", features = ["full"] }

# MongoDB
mongodb = { version = "3" }
bson = { version = "2", features = ["chrono-0_4"] }

# JWT & Auth
jsonwebtoken = "9"
argon2 = "0.5"
rand = "0.8"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Validation
validator = { version = "0.18", features = ["derive"] }

# Error handling
thiserror = "1"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Config
dotenvy = "0.15"

# Time
chrono = { version = "0.4", features = ["serde"] }

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# Async
futures = "0.3"
async-trait = "0.1"

# OpenAPI / Docs (Phase 8)
utoipa = { version = "4", features = ["axum_extras", "chrono"] }
utoipa-swagger-ui = { version = "6", features = ["axum"] }

# Import/Export helpers (Phase 10)
url = "2"
urlencoding = "2"

# Base64 encoding
base64 = "0.21"

# HTTP client (for SendGrid email API)
reqwest = { version = "0.12", features = ["json"] }

# Hashing (invite tokens)
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
axum-test = { version = "15", features = ["ws"] }
uuid = { version = "1", features = ["v4"] }
testcontainers = "0.22"
testcontainers-modules = { version = "0.10", features = ["mongo"] }
